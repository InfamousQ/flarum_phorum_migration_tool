services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: flarum_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: composer

  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: flarum_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_PREFIX: flarum_
    depends_on:
      db:
        condition: service_healthy
